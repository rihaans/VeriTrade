{% if messages %}
  <div class="messages" role="status" aria-live="polite">
    {% for message in messages %}
      <div class="alert alert--{{ message.tags|default:'info' }}">
        <span class="alert__text">{{ message }}</span>
        <button class="alert__close" type="button" data-dismiss aria-label="Dismiss">&times;</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
