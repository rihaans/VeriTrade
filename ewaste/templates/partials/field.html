{# Renders one bound form field. Include with: {% include "partials/field.html" with field=form.name %} #}
<div class="field{% if field.errors %} field--invalid{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="field__help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
</div>
